name: Daily draft notification

on:
  schedule:
    # 毎日 UTC 11:07 = JST 20:07（ちょうど00分だと混雑で遅延・スキップされやすいためずらしている）
    - cron: "7 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pick today's draft
        id: draft
        run: |
          TEXT=$(python pick_draft.py)
          {
            echo "text<<DRAFT_EOF"
            echo "$TEXT"
            echo "DRAFT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create issue with the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "$(date +%Y-%m-%d) の投稿案" \
            --body "${{ steps.draft.outputs.text }}

          ---
          内容を確認・修正して、ご自身でXに投稿してください。" \
            --assignee "${{ github.repository_owner }}"

      - name: Save rotation state back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "chore: update draft rotation state [skip ci]"
          git push
