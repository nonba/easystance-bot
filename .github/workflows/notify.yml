name: Daily draft list notification

on:
  schedule:
    # 毎日 UTC 11:07 = JST 20:07（ちょうど00分だと混雑で遅延・スキップされやすいためずらしている）
    - cron: "7 11 * * *"
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: List all drafts
        id: list
        run: |
          TEXT=$(python list_drafts.py)
          {
            echo "text<<DRAFT_EOF"
            echo "$TEXT"
            echo "DRAFT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create issue with the full list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "$(date +%Y-%m-%d) の投稿候補一覧" \
            --body "${{ steps.list.outputs.text }}

          ---
          好きなものを選んで、修正してからご自身でXに投稿してください。" \
            --assignee "${{ github.repository_owner }}"
